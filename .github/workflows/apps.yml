name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          npm ci
          npm run web
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../jeerah.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: jeerah.apk

  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare iOS project
        run: |
          npm ci
          npm run web
          npx cap add ios
          npx cap sync ios
          cp assets/icons/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr jeerah-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: jeerah-unsigned.ipa

  release:
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -R out
          gh release view latest -R "$REPO" >/dev/null 2>&1 || gh release create latest -R "$REPO" --title "Jeerah latest" --notes "Android build ready to install."
          gh release upload latest out/android/jeerah.apk -R "$REPO" --clobber
          if [ -f out/ios/jeerah-unsigned.ipa ]; then gh release upload latest out/ios/jeerah-unsigned.ipa -R "$REPO" --clobber; fi
