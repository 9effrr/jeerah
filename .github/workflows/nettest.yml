name: Network test
on:
  workflow_dispatch:
    inputs:
      base:
        description: Site to test
        default: https://9effrr.github.io/jeerah/
jobs:
  net:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tests/nettest.mjs
        env: { BASE: "${{ inputs.base }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: shots, path: "*.png" }
